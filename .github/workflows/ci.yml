name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, Vet & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.14"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"

          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v

      # The relay is concurrent, so run the complete suite under
      # the race detector as an additional correctness gate.
      - name: Test (race detector)
        run: go test -race ./... -count=1

      # Keep govulncheck compatible with the project's Go version.
      # Do not install @latest because newer x/vuln releases may require
      # a newer Go toolchain than the project supports.
      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Vulnerability scan
        run: |
          govulncheck ./...
