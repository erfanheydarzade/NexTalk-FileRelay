name: Release

# Push a button instead of tagging-and-waiting: run this from the Actions
# tab (Run workflow) and choose a version. It tags that version, builds
# nextalk-file-relay for every supported OS/arch as .tar.gz/.zip archives,
# packages the filerelay bridge transport as installable .ntx bundles for
# every supported OS/arch, and publishes everything as one GitHub Release
# with an auto-generated changelog.
#
# Re-running this workflow for a version that's already released is safe:
# the "Tag release" step is a no-op if the tag already exists, goreleaser +
# the release action simply update the existing release's assets/notes
# rather than failing, and the .ntx upload step uses --clobber so re-running
# overwrites the previous .ntx assets instead of erroring on "already exists".
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release, e.g. v1.4.0 (must start with "v" and follow
          semver). Leave the "prerelease" box checked for a beta/rc build.
        required: true
        type: string
      prerelease:
        description: "Mark this as a pre-release (not shown as 'latest')"
        required: false
        type: boolean
        default: false
  # Also supports the traditional `git tag vX.Y.Z && git push --tags` flow
  # for anyone who prefers that over the manual button.
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Validate version input
        id: resolve
        run: |
          version="${{ inputs.version }}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid semver tag (expected e.g. v1.4.0 or v1.4.0-rc.1)"
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag (no-op if it already exists)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" || true
          git push origin "$TAG"
        env:
          TAG: ${{ steps.resolve.outputs.tag }}

  release:
    name: Publish release
    needs: [tag]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-bridge:
    name: Package filerelay .ntx bridge
    needs: [tag, release]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    env:
      # workflow_dispatch resolves the tag via the "tag" job; the
      # push-tag trigger skips that job, so fall back to the ref name.
      TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Vet & test the bridge (package.sh/.ps1 refuse to package on failure — mirror that here)
        working-directory: transports/filerelay
        run: |
          go vet ./bridge/...
          go test ./bridge/... -count=1

      - name: Cross-compile filerelay-bridge and package one .ntx per OS/arch
        working-directory: transports/filerelay
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # The bridge doesn't import internal/buildinfo (that's the
          # server's version hook), so there's nothing to -X inject here;
          # -s -w alone strips symbols/DWARF to shrink the binary. The
          # bridge's own version identity is the manifest.json "version"
          # field stamped below.
          LDFLAGS="-s -w"

          DIST="$(git rev-parse --show-toplevel)/dist"
          mkdir -p "$DIST"

          # Same OS/arch matrix as .goreleaser.yaml's server build, minus the
          # combinations goreleaser itself ignores (darwin/arm, windows/arm,
          # windows/arm64).
          targets=(
            "linux amd64 "
            "linux arm64 "
            "linux arm 7"
            "darwin amd64 "
            "darwin arm64 "
            "windows amd64 "
          )

          for t in "${targets[@]}"; do
            read -r goos goarch goarm <<< "$t"

            entry="filerelay-bridge"
            manifest="manifest.json"
            [ "$goos" = "windows" ] && entry="filerelay-bridge.exe" && manifest="manifest.windows.json"

            echo "==> build $goos/$goarch${goarm:+v$goarm}"
            rm -f "$entry"
            GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" CGO_ENABLED=0 \
              go build -ldflags "$LDFLAGS" -o "$entry" ./bridge

            # Stage into manifest.json + entry binary at the archive root
            # (the installed .ntx layout package.sh/.ps1 use), with the
            # manifest's "version" stamped to this release's tag instead
            # of shipping the 1.0.0 placeholder committed in the repo.
            # Staged in a scratch dir so the tracked manifest files are
            # never modified in place.
            rm -rf .ntx-stage && mkdir .ntx-stage
            sed "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" "$manifest" > .ntx-stage/manifest.json
            cp "$entry" .ntx-stage/

            suffix="${goos}_${goarch}${goarm:+v$goarm}"
            ntx="$DIST/filerelay-bridge_${VERSION}_${suffix}.ntx"
            rm -f "$ntx"
            (cd .ntx-stage && zip -j "$ntx" manifest.json "$entry")
            rm -rf .ntx-stage "$entry"
            echo "packaged: $ntx"
          done

          ls -la "$DIST"

      - name: Checksums for the .ntx bundles
        working-directory: dist
        run: sha256sum filerelay-bridge_*.ntx > filerelay-bridge_checksums.txt

      - name: Upload .ntx bundles to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" dist/filerelay-bridge_*.ntx dist/filerelay-bridge_checksums.txt \
            --repo "${{ github.repository }}" --clobber
