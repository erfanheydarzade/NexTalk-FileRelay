name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.4.0 or v1.4.0-rc.1"
        required: true
        type: string

      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}

    steps:
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $TAG"
            echo "::error::Expected format: v1.4.0 or v1.4.0-rc.1"
            exit 1
          fi

          echo "Release tag: $TAG"
          echo "Pre-release: $PRERELEASE"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      # ------------------------------------------------------------
      # Validate everything BEFORE creating/publishing the release.
      # ------------------------------------------------------------

      - name: Vet and test bridge
        working-directory: transports/filerelay
        shell: bash
        run: |
          set -euo pipefail

          go vet ./bridge/...
          go test ./bridge/... -count=1

      - name: Cross-compile and package .ntx bundles
        working-directory: transports/filerelay
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          LDFLAGS="-s -w"

          ROOT="$(git rev-parse --show-toplevel)"
          DIST="$ROOT/bridge-dist"

          rm -rf "$DIST"
          mkdir -p "$DIST"

          targets=(
            "linux amd64"
            "linux arm64"
            "linux arm 7"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )

          for target in "${targets[@]}"; do
            read -r GOOS GOARCH GOARM <<< "$target"

            ENTRY="filerelay-bridge"
            MANIFEST="manifest.json"

            if [[ "$GOOS" == "windows" ]]; then
              ENTRY="filerelay-bridge.exe"
              MANIFEST="manifest.windows.json"
            fi

            echo
            echo "==> Building ${GOOS}/${GOARCH}${GOARM:+v${GOARM}}"

            rm -f "$ENTRY"
            rm -rf .ntx-stage
            mkdir -p .ntx-stage

            if [[ -n "${GOARM:-}" ]]; then
              GOOS="$GOOS" \
              GOARCH="$GOARCH" \
              GOARM="$GOARM" \
              CGO_ENABLED=0 \
              go build \
                -ldflags "$LDFLAGS" \
                -o "$ENTRY" \
                ./bridge
            else
              GOOS="$GOOS" \
              GOARCH="$GOARCH" \
              CGO_ENABLED=0 \
              go build \
                -ldflags "$LDFLAGS" \
                -o "$ENTRY" \
                ./bridge
            fi

            test -s "$ENTRY"

            jq \
              --arg version "$VERSION" \
              '.version = $version' \
              "$MANIFEST" \
              > .ntx-stage/manifest.json

            jq -e \
              --arg version "$VERSION" \
              '.version == $version' \
              .ntx-stage/manifest.json \
              >/dev/null

            cp "$ENTRY" .ntx-stage/

            SUFFIX="${GOOS}_${GOARCH}${GOARM:+v${GOARM}}"
            NTX="$DIST/filerelay-bridge_${VERSION}_${SUFFIX}.ntx"

            (
              cd .ntx-stage
              zip -q -j "$NTX" manifest.json "$ENTRY"
            )

            test -s "$NTX"
            unzip -tq "$NTX"

            rm -rf .ntx-stage "$ENTRY"

            echo "Packaged: $NTX"
          done

          echo
          echo "==> Generated bridge bundles:"
          ls -lah "$DIST"

      - name: Generate bridge checksums
        working-directory: bridge-dist
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            filerelay-bridge_*.ntx \
            > filerelay-bridge_checksums.txt

          test -s filerelay-bridge_checksums.txt

          echo "==> Bridge checksums:"
          cat filerelay-bridge_checksums.txt

      - name: Verify bridge bundle count
        shell: bash
        run: |
          set -euo pipefail

          count="$(find bridge-dist \
            -maxdepth 1 \
            -type f \
            -name 'filerelay-bridge_*.ntx' \
            | wc -l)"

          if [[ "$count" -ne 6 ]]; then
            echo "::error::Expected 6 .ntx bundles, found $count."
            find bridge-dist -maxdepth 1 -type f -print
            exit 1
          fi

          echo "Verified $count bridge bundles."

      # ------------------------------------------------------------
      # Tag only after all bridge artifacts have been validated.
      # ------------------------------------------------------------

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."

            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"

            CURRENT_SHA="$(git rev-parse HEAD)"
            TAG_SHA="$(git rev-list -n 1 "$TAG")"

            if [[ "$CURRENT_SHA" != "$TAG_SHA" ]]; then
              echo "::error::Tag $TAG already exists but points to a different commit."
              echo "::error::Current commit: $CURRENT_SHA"
              echo "::error::Tag commit:     $TAG_SHA"
              exit 1
            fi
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG."
          fi

      - name: Checkout release tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags origin
          git checkout "$TAG"

          echo "Checked out:"
          git rev-parse HEAD

          echo "Tag:"
          git describe --tags --exact-match

      # ------------------------------------------------------------
      # Build GoReleaser artifacts, but DO NOT publish yet.
      # ------------------------------------------------------------

      - name: Run GoReleaser without publishing
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GoReleaser output
        shell: bash
        run: |
          set -euo pipefail

          echo "==> GoReleaser dist contents:"
          find dist -maxdepth 2 -type f -print | sort

          if ! find dist -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' \) \
            | grep -q .; then
            echo "::error::GoReleaser did not produce any archives."
            exit 1
          fi

      # ------------------------------------------------------------
      # Create ONE draft release.
      # Nothing is immutable yet because it is still a draft.
      # ------------------------------------------------------------

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          NOTES_ARGS=()

          if [[ -f dist/CHANGELOG.md ]]; then
            NOTES_ARGS+=(--notes-file dist/CHANGELOG.md)
          else
            NOTES_ARGS+=(--generate-notes)
          fi

          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            "${NOTES_ARGS[@]}"

      # ------------------------------------------------------------
      # Upload GoReleaser artifacts while the release is still draft.
      # ------------------------------------------------------------

      - name: Upload GoReleaser artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mapfile -t RELEASE_ASSETS < <(
            find dist -maxdepth 1 -type f \
              ! -name 'artifacts.json' \
              ! -name 'CHANGELOG.md' \
              -print \
              | sort
          )

          if [[ "${#RELEASE_ASSETS[@]}" -eq 0 ]]; then
            echo "::error::No GoReleaser release assets found."
            exit 1
          fi

          echo "Uploading GoReleaser assets:"
          printf '  %s\n' "${RELEASE_ASSETS[@]}"

          gh release upload \
            "$TAG" \
            "${RELEASE_ASSETS[@]}" \
            --repo "${GITHUB_REPOSITORY}"

      # ------------------------------------------------------------
      # Upload all six .ntx bridge bundles + checksums.
      # ------------------------------------------------------------

      - name: Upload bridge bundles
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mapfile -t BRIDGE_ASSETS < <(
            find bridge-dist -maxdepth 1 -type f \
              \( -name '*.ntx' -o -name 'filerelay-bridge_checksums.txt' \) \
              -print \
              | sort
          )

          if [[ "${#BRIDGE_ASSETS[@]}" -ne 7 ]]; then
            echo "::error::Expected 7 bridge assets (6 .ntx + 1 checksum), found ${#BRIDGE_ASSETS[@]}."
            printf '  %s\n' "${BRIDGE_ASSETS[@]}"
            exit 1
          fi

          echo "Uploading bridge assets:"
          printf '  %s\n' "${BRIDGE_ASSETS[@]}"

          gh release upload \
            "$TAG" \
            "${BRIDGE_ASSETS[@]}" \
            --repo "${GITHUB_REPOSITORY}"

      # ------------------------------------------------------------
      # Final verification while the release is STILL a draft.
      # ------------------------------------------------------------

      - name: Verify draft release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "==> Release assets:"
          gh release view "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets[].name'

          EXPECTED=(
            "filerelay-bridge_*.ntx"
            "filerelay-bridge_checksums.txt"
          )

          for pattern in "${EXPECTED[@]}"; do
            if ! gh release view "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name' \
              | grep -Eq "^${pattern//\*/.*}$"; then
              echo "::error::Missing release asset matching: $pattern"
              exit 1
            fi
          done

          echo "Draft release assets verified."

      # ------------------------------------------------------------
      # ONLY NOW publish the release.
      # With release immutability enabled, this is the final mutation.
      # ------------------------------------------------------------

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false \
              --prerelease
          else
            gh release edit "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false
          fi

          echo "Release $TAG published."
