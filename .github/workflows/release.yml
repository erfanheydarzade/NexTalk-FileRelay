```yaml
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.4.0 or v1.4.0-rc.1"
        required: true
        type: string

  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            echo "::error::Expected format: v1.4.0 or v1.4.0-rc.1"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Checkout repository
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG."
          fi

  release:
    name: Publish release
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-bridge:
    name: Package filerelay .ntx bridge
    needs:
      - prepare
      - release
    runs-on: ubuntu-latest

    env:
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Vet and test bridge
        working-directory: transports/filerelay
        run: |
          set -euo pipefail

          go vet ./bridge/...
          go test ./bridge/... -count=1

      - name: Cross-compile and package .ntx bundles
        working-directory: transports/filerelay
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          LDFLAGS="-s -w"

          DIST="$(git rev-parse --show-toplevel)/dist"
          mkdir -p "$DIST"

          targets=(
            "linux amd64"
            "linux arm64"
            "linux arm 7"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )

          for target in "${targets[@]}"; do
            read -r GOOS GOARCH GOARM <<< "$target"

            ENTRY="filerelay-bridge"
            MANIFEST="manifest.json"

            if [[ "$GOOS" == "windows" ]]; then
              ENTRY="filerelay-bridge.exe"
              MANIFEST="manifest.windows.json"
            fi

            echo "==> Building ${GOOS}/${GOARCH}${GOARM:+v${GOARM}}"

            rm -f "$ENTRY"

            if [[ -n "${GOARM:-}" ]]; then
              GOOS="$GOOS" \
              GOARCH="$GOARCH" \
              GOARM="$GOARM" \
              CGO_ENABLED=0 \
                go build \
                  -ldflags "$LDFLAGS" \
                  -o "$ENTRY" \
                  ./bridge
            else
              GOOS="$GOOS" \
              GOARCH="$GOARCH" \
              CGO_ENABLED=0 \
                go build \
                  -ldflags "$LDFLAGS" \
                  -o "$ENTRY" \
                  ./bridge
            fi

            rm -rf .ntx-stage
            mkdir -p .ntx-stage

            sed \
              "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" \
              "$MANIFEST" \
              > .ntx-stage/manifest.json

            cp "$ENTRY" .ntx-stage/

            SUFFIX="${GOOS}_${GOARCH}${GOARM:+v${GOARM}}"
            NTX="$DIST/filerelay-bridge_${VERSION}_${SUFFIX}.ntx"

            rm -f "$NTX"

            (
              cd .ntx-stage
              zip -j "$NTX" manifest.json "$ENTRY"
            )

            rm -rf .ntx-stage "$ENTRY"

            echo "Packaged: $NTX"
          done

          ls -lah "$DIST"

      - name: Generate bridge checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            filerelay-bridge_*.ntx \
            > filerelay-bridge_checksums.txt

          cat filerelay-bridge_checksums.txt

      - name: Upload bridge bundles to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release upload \
            "${{ needs.prepare.outputs.tag }}" \
            dist/filerelay-bridge_*.ntx \
            dist/filerelay-bridge_checksums.txt \
            --repo "${{ github.repository }}" \
            --clobber
```
