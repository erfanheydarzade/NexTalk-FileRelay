```yaml
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.4.0 or v1.4.0-rc.1"
        required: true
        type: string

      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}

    steps:
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $TAG"
            echo "::error::Expected format: v1.4.0 or v1.4.0-rc.1"
            exit 1
          fi

          echo "Release tag: $TAG"
          echo "Pre-release: $PRERELEASE"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."

            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"

            CURRENT_SHA="$(git rev-parse HEAD)"
            TAG_SHA="$(git rev-list -n 1 "$TAG")"

            if [[ "$CURRENT_SHA" != "$TAG_SHA" ]]; then
              echo "::error::Tag $TAG already exists but points to a different commit."
              echo "::error::Current commit: $CURRENT_SHA"
              echo "::error::Tag commit:     $TAG_SHA"
              exit 1
            fi
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG."
          fi

      - name: Checkout release tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags origin
          git checkout "$TAG"

          echo "Checked out:"
          git rev-parse HEAD
          echo "Tag:"
          git describe --tags --exact-match

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark release as pre-release
        if: inputs.prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release edit "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --prerelease

      - name: Vet and test bridge
        working-directory: transports/filerelay
        shell: bash
        run: |
          set -euo pipefail

          go vet ./bridge/...
          go test ./bridge/... -count=1

      - name: Cross-compile and package .ntx bundles
        working-directory: transports/filerelay
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          LDFLAGS="-s -w"

          DIST="$(git rev-parse --show-toplevel)/dist"
          mkdir -p "$DIST"

          targets=(
            "linux amd64"
            "linux arm64"
            "linux arm 7"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )

          for target in "${targets[@]}"; do
            read -r GOOS GOARCH GOARM <<< "$target"

            ENTRY="filerelay-bridge"
            MANIFEST="manifest.json"

            if [[ "$GOOS" == "windows" ]]; then
              ENTRY="filerelay-bridge.exe"
              MANIFEST="manifest.windows.json"
            fi

            echo "==> Building ${GOOS}/${GOARCH}${GOARM:+v${GOARM}}"

            rm -f "$ENTRY"

            if [[ -n "${GOARM:-}" ]]; then
              GOOS="$GOOS" \
              GOARCH="$GOARCH" \
              GOARM="$GOARM" \
              CGO_ENABLED=0 \
              go build \
                -ldflags "$LDFLAGS" \
                -o "$ENTRY" \
                ./bridge
            else
              GOOS="$GOOS" \
              GOARCH="$GOARCH" \
              CGO_ENABLED=0 \
              go build \
                -ldflags "$LDFLAGS" \
                -o "$ENTRY" \
                ./bridge
            fi

            rm -rf .ntx-stage
            mkdir -p .ntx-stage

            sed \
              "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" \
              "$MANIFEST" \
              > .ntx-stage/manifest.json

            cp "$ENTRY" .ntx-stage/

            SUFFIX="${GOOS}_${GOARCH}${GOARM:+v${GOARM}}"
            NTX="$DIST/filerelay-bridge_${VERSION}_${SUFFIX}.ntx"

            rm -f "$NTX"

            (
              cd .ntx-stage
              zip -j "$NTX" manifest.json "$ENTRY"
            )

            rm -rf .ntx-stage "$ENTRY"

            echo "Packaged: $NTX"
          done

          ls -lah "$DIST"

      - name: Generate bridge checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            filerelay-bridge_*.ntx \
            > filerelay-bridge_checksums.txt

          cat filerelay-bridge_checksums.txt

      - name: Upload bridge bundles
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release upload \
            "$TAG" \
            dist/filerelay-bridge_*.ntx \
            dist/filerelay-bridge_checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
```
