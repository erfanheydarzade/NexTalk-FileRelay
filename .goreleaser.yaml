# GoReleaser config for NexTalk-FileRelay.
#
# Builds the `nextalk-file-relay` CLI for every supported OS/arch, packages each
# as a .tar.gz (.zip on Windows), generates checksums, and writes a changelog
# from Conventional-Commit-style commit messages.
#
# Local test run (no publish): goreleaser release --snapshot --clean
version: 2
project_name: nextalk-file-relay

before:
  hooks:
    - go mod tidy

builds:
  - id: nextalk-file-relay
    main: ./cmd/filerelayd
    binary: nextalk-file-relay
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/erfanheydarzade/NexTalk-FileRelay/internal/buildinfo.Version={{.Version}}
      - -X github.com/erfanheydarzade/NexTalk-FileRelay/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/erfanheydarzade/NexTalk-FileRelay/internal/buildinfo.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      # darwin/arm and windows/arm are not meaningful targets.
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64

archives:
  - id: nextalk-file-relay-archive
    ids: [nextalk-file-relay]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

# Raw, unpacked binary for people who'd rather download-and-run than
# download-extract-move. Same naming scheme as the archive above; the
# native binary extension (.exe on Windows) is appended automatically.
release:
  extra_files:
    - glob: ./dist/nextalk-file-relay_linux_amd64*/nextalk-file-relay
      name_template: nextalk-file-relay_{{ .Version }}_linux_amd64
    - glob: ./dist/nextalk-file-relay_darwin_amd64*/nextalk-file-relay
      name_template: nextalk-file-relay_{{ .Version }}_darwin_amd64
    - glob: ./dist/nextalk-file-relay_linux_arm64*/nextalk-file-relay
      name_template: nextalk-file-relay_{{ .Version }}_linux_arm64
    - glob: ./dist/nextalk-file-relay_darwin_arm64*/nextalk-file-relay
      name_template: nextalk-file-relay_{{ .Version }}_darwin_arm64
